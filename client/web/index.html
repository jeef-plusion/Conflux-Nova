<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conflux Nova</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css">
</head><body>
<div class="app">

  <!-- 左栏：会话历史 -->
  <aside class="side">
    <div class="brand"><span class="logo"></span><span>Conflux Nova</span><em>v2.2.0</em></div>
    <button id="newChat" class="newChat"><span>＋</span> 新建对话</button>
    <div class="hist" id="hist"></div>
    <div class="sideFoot"><span>GTX 1080 Ti</span><i id="dot"></i></div>
  </aside>

  <!-- 中栏：对话 -->
  <main class="main">
    <div class="scroll" id="scroll">
      <div class="thread" id="thread">
        <div class="welcome" id="welcome">
          <div class="wmark"></div>
          <h1>今天想聊点什么？</h1>
          <div class="cards">
            <button class="card"><b>解释概念</b><span>用一句话解释什么是导数</span></button>
            <button class="card"><b>写代码</b><span>用 C++ 写一个快速排序</span></button>
            <button class="card"><b>推导</b><span>推导 f(x)=x³-3x 的极值点</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="有问题，尽管问"></textarea>
        <button id="send" class="send" title="发送">↑</button>
      </div>
      <div class="tip">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </main>

  <!-- 右栏：遥测 -->
  <aside class="tele">
    <div class="tTitle">Engine Telemetry</div>
    <div class="tChart"><canvas id="chart"></canvas></div>
    <div class="tRate"><b id="tps">0.0</b><span>tok/s</span></div>
    <div class="cards2">
      <div class="mini"><span>显存</span><b id="vram">0.00/0.00</b><i>GB</i></div>
      <div class="mini"><span>上下文</span><b id="npast">0</b><i>tok</i></div>
      <div class="mini"><span>物理块</span><b id="blocks">0/0</b></div>
      <div class="mini"><span>共享块</span><b id="shared">0</b></div>
      <div class="mini"><span>COW</span><b id="cow" class="warm">0</b></div>
      <div class="mini"><span>模型</span><b id="model" class="tiny">未加载</b></div>
    </div>
    <div class="tModel">
      <input id="gguf" value="build/q4k.gguf" spellcheck="false">
      <button id="load" class="loadBtn">加载</button>
    </div>
    <div class="tFoot" id="stat">未加载</div>
  </aside>
</div>
<script src="app.js"></script></body></html>
