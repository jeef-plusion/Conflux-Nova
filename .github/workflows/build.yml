name: build

# ============================================================================
#  CI 的三道闸门（每次 push / PR 都跑）：
#    1. format    —— clang-format 检查（注释与缩进不许漂）
#    2. host      —— 纯 CPU 构建 + **数值对拍**（不需要显卡，这是最重要的一关）
#    3. cuda      —— Windows 上装 CUDA 编译引擎（只验证"能编"，无 GPU 不跑）
#
#  SYCL 后端需要 Intel GPU + oneAPI，GitHub 托管机没有，所以只在 README 里
#  给出本地验证步骤，不放进 CI（诚实：跑不了的闸门不要装样子）。
# ============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format
      - name: 检查格式（只查 C++ 源，不查 .bat）
        run: |
          files=$(git ls-files '*.cpp' '*.h' '*.cu' '*.cuh')
          if [ -z "$files" ]; then echo "no sources"; exit 0; fi
          clang-format --dry-run --Werror $files && echo "format OK"

  host:
    name: host-numeric (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 配置（HOST：只编 CPU 垫片）
        run: cmake -B build-cmake -DNOVA_BACKEND=HOST -DNOVA_MODEL=QWEN25_1P5B

      - name: 构建
        run: cmake --build build-cmake --config Release -j 4

      - name: 冒烟（无模型文件时，垫片应当打印用法并以非 0 退出，而不是崩）
        shell: bash
        run: |
          exe=$(find build-cmake -name 'nova_host_check*' -type f | head -n1)
          echo "exe=$exe"
          set +e
          "$exe" /nonexistent.gguf > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          # 0xC0000409 / segfault 这类崩溃码不允许出现
          if [ $rc -eq 139 ] || [ $rc -eq 134 ]; then echo "垫片崩溃了 (rc=$rc)"; exit 1; fi
          echo "smoke rc=$rc (允许：缺模型时的正常退出)"

      - name: 数值对拍（仓库里带模型时才跑）
        shell: bash
        run: |
          if [ -f build/q4k_15b.gguf ]; then
            exe=$(find build-cmake -name 'nova_host_check*' -type f | head -n1)
            "$exe" build/q4k_15b.gguf | tee check.log
            grep -q "失败项 = 0" check.log
          else
            echo "仓库里没有模型（正常：模型不进 git），跳过数值对拍"
          fi

  cuda:
    name: cuda-compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 检查 CUDA 工具链
        id: probe
        shell: bash
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            echo "nvcc=$(nvcc --version | tail -n1)"
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "no nvcc on this runner"
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置
        if: steps.probe.outputs.have == '1'
        run: cmake -B build-cmake -DNOVA_BACKEND=CUDA -DNOVA_MODEL=QWEN25_7B -DNOVA_CUDA_ARCH=sm_61

      - name: 构建
        if: steps.probe.outputs.have == '1'
        run: cmake --build build-cmake --config Release -j 4

      - name: 跳过说明
        if: steps.probe.outputs.have != '1'
        run: echo "该 runner 无 CUDA 工具链，跳过（不装样子地绿）"
